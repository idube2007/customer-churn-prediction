<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Predictor</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f9fafb;
            --text: #111827;
            --card-bg: #ffffff;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result {
            margin-top: 2rem;
            padding: 1.25rem;
            border-radius: 0.5rem;
            text-align: center;
        }

        .churn {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .no-churn {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .result h3 {
            margin-top: 0;
            margin-bottom: 0.5rem;
        }

        .probability {
            font-size: 0.875rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Churn Predictor</h1>
        <form action="/predict" method="post">
            <div class="form-group">
                <label for="tenure">Tenure (Months)</label>
                <input type="number" id="tenure" name="tenure" required min="1" max="72" placeholder="e.g. 12">
            </div>
            <div class="form-group">
                <label for="monthly_charges">Monthly Charges ($)</label>
                <input type="number" step="0.01" id="monthly_charges" name="monthly_charges" required placeholder="e.g. 50.00">
            </div>
            <div class="form-group">
                <label for="total_charges">Total Charges ($)</label>
                <input type="number" step="0.01" id="total_charges" name="total_charges" required placeholder="e.g. 600.00">
            </div>
            <div class="form-group">
                <label for="support_calls">Support Calls</label>
                <input type="number" id="support_calls" name="support_calls" required min="0" max="10" placeholder="e.g. 3">
            </div>
            <button type="submit">Analyze Customer</button>
        </form>

        {% if prediction is not none %}
            <div class="result {% if prediction == 1 %}churn{% else %}no-churn{% endif %}">
                <h3>
                    {% if prediction == 1 %}
                        ⚠️ Likely to Churn
                    {% else %}
                        ✅ Likely to Stay
                    {% endif %}
                </h3>
                <p class="probability">Churn Probability: {{ probability }}%</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
